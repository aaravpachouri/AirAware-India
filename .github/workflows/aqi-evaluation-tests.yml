name: AQI evaluation tests

on:
  push:
    branches:
      - main
      - fix/reproducible-aqi-validation
    paths:
      - "src/evaluation_utils.py"
      - "tests/**"
      - ".github/workflows/aqi-evaluation-tests.yml"
  pull_request:
    paths:
      - "src/evaluation_utils.py"
      - "tests/**"
      - ".github/workflows/aqi-evaluation-tests.yml"

permissions:
  contents: read

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run evaluation utility tests
        run: python -m pytest -q tests/test_evaluation_utils.py
