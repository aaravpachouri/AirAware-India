name: Prospective station validation

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospective-station-validation
  cancel-in-progress: false

jobs:
  collect-and-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public research ledger
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Require OpenAQ API key
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          if [ -z "$OPENAQ_API_KEY" ]; then
            echo "::error::Add OPENAQ_API_KEY under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Collect forecasts and pair matured station observations
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          AIR_AWARE_MAX_STATIONS: "25"
        run: python src/prospective_station_validation.py
      - name: Summarise prospective validation
        run: |
          set -euo pipefail
          python src/evaluate_prospective_station_validation.py | tee prospective-validation-summary.json
          python -c 'import json, os; from pathlib import Path; s=json.loads(Path("prospective-validation-summary.json").read_text(encoding="utf-8")); lines=["## Prospective station validation", "", f"- Evaluated forecasts: **{s.get(chr(101)+chr(118)+chr(97)+chr(108)+chr(117)+chr(97)+chr(116)+chr(101)+chr(100)+chr(95)+chr(102)+chr(111)+chr(114)+chr(101)+chr(99)+chr(97)+chr(115)+chr(116)+chr(115), 0)}**", f"- Stations / cities: **{s.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(105)+chr(111)+chr(110)+chr(115), 0)} / {s.get(chr(99)+chr(105)+chr(116)+chr(105)+chr(101)+chr(115), 0)}**", f"- Model MAE: **{s.get(chr(109)+chr(111)+chr(100)+chr(101)+chr(108)+chr(95)+chr(109)+chr(97)+chr(101))}**", f"- Persistence MAE: **{s.get(chr(112)+chr(101)+chr(114)+chr(115)+chr(105)+chr(115)+chr(116)+chr(101)+chr(110)+chr(99)+chr(101)+chr(95)+chr(109)+chr(97)+chr(101))}**", f"- MAE improvement: **{s.get(chr(109)+chr(97)+chr(101)+chr(95)+chr(105)+chr(109)+chr(112)+chr(114)+chr(111)+chr(118)+chr(101)+chr(109)+chr(101)+chr(110)+chr(116))}**", "", s.get("interpretation", "No interpretation available."), "", "OpenAQ-derived station snapshots; not official CPCB 24-hour AQI."]; open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\\n".join(lines)+"\\n")'
      - name: Commit public research ledger
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospective_station_validation.jsonl
          if git diff --cached --quiet; then
            echo "No new forecast or evaluation records."
            exit 0
          fi
          git commit -m "Record prospective station forecast validation"
          git push origin HEAD:main
      - name: Preserve per-run prospective metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-validation-summary-${{ github.run_id }}
          path: prospective-validation-summary.json
          if-no-files-found: ignore
          retention-days: 90
