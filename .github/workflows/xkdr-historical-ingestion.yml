name: XKDR historical ingestion tests

on:
  pull_request:
    paths:
      - "scripts/ingest_xkdr_historical.py"
      - "tests/test_xkdr_historical_ingestion.py"
      - "requirements.txt"
      - ".github/workflows/xkdr-historical-ingestion.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_xkdr_historical.py"
      - "tests/test_xkdr_historical_ingestion.py"
      - "requirements.txt"
      - ".github/workflows/xkdr-historical-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Compile ingestion code
        run: python -m compileall -q scripts/ingest_xkdr_historical.py
      - name: Run ingestion unit tests
        run: python -m pytest -q tests/test_xkdr_historical_ingestion.py
