name: XKDR historical ingestion tests and pilot

on:
  pull_request:
    paths:
      - "scripts/ingest_xkdr_historical.py"
      - "scripts/audit_xkdr_pilot.py"
      - "scripts/build_xkdr_cpcb_aqi.py"
      - "tests/test_xkdr_historical_ingestion.py"
      - "tests/test_xkdr_pilot_audit.py"
      - "tests/test_xkdr_cpcb_aqi.py"
      - "requirements.txt"
      - "docs/XKDR_CPCB_AQI_RECONSTRUCTION.md"
      - ".github/workflows/xkdr-historical-ingestion.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_xkdr_historical.py"
      - "scripts/audit_xkdr_pilot.py"
      - "tests/test_xkdr_historical_ingestion.py"
      - "tests/test_xkdr_pilot_audit.py"
      - "requirements.txt"
      - ".github/workflows/xkdr-historical-ingestion.yml"
  workflow_dispatch:
    inputs:
      start_month:
        description: "First month to ingest (YYYY-MM)"
        required: true
        default: "2024-01"
        type: string
      end_month:
        description: "Last month to ingest (YYYY-MM)"
        required: true
        default: "2024-01"
        type: string

permissions:
  contents: read

jobs:
  ingestion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Compile ingestion and audit code
        run: python -m compileall -q scripts/ingest_xkdr_historical.py scripts/audit_xkdr_pilot.py scripts/build_xkdr_cpcb_aqi.py
      - name: Run ingestion and independent QA tests
        run: python -m pytest -q tests/test_xkdr_historical_ingestion.py tests/test_xkdr_pilot_audit.py tests/test_xkdr_cpcb_aqi.py
      - name: Run selected XKDR CPCB ingestion pilot
        if: github.event_name == 'workflow_dispatch'
        env:
          XKDR_API_KEY: ${{ secrets.XKDR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$XKDR_API_KEY" || { echo "XKDR_API_KEY GitHub Actions secret is missing."; exit 1; }
          python scripts/ingest_xkdr_historical.py \
            --start "${{ inputs.start_month }}" \
            --end "${{ inputs.end_month }}"
      - name: Independently audit selected CPCB pilot
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/audit_xkdr_pilot.py
      - name: Build isolated normalized CPCB observations and reconstructed AQI
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build_xkdr_cpcb_aqi.py --data-dir data/xkdr_cpcb --output-dir data/xkdr_cpcb_derived
      - name: Upload isolated CPCB pilot dataset and QA report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: airaware-xkdr-cpcb-${{ inputs.start_month }}-${{ inputs.end_month }}-audited
          path: |
            data/xkdr_cpcb/**
            reports/xkdr_pilot_quality_audit.json
            data/xkdr_cpcb_derived/**
          if-no-files-found: error
          retention-days: 30
